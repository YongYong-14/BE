spring:
  application:
    name: parking-server
  datasource:
    hikari:
      data-source-properties:
        # PostgreSQL error DETAIL may contain the entire failing row, including MAC addresses.
        logServerErrorDetail: false

springdoc:
  default-produces-media-type: application/json
  api-docs:
    version: OPENAPI_3_1
  paths-to-match: /api/v1/**
  packages-to-scan: io.github.yongyong14.parking_server
  override-with-generic-response: false

app:
  auth:
    issuer: ${JWT_ISSUER}
    secret-base64: ${JWT_SECRET_BASE64}
    access-ttl: ${JWT_ACCESS_TTL:30m}
    refresh-ttl: ${AUTH_REFRESH_TTL:30d}
  security:
    swagger-public: false
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
