spring:
  application:
    name: parking-server
  datasource:
    hikari:
      data-source-properties:
        # PostgreSQL DETAIL can contain account data and vehicle MAC addresses.
        logServerErrorDetail: false

springdoc:
  default-produces-media-type: application/json
  api-docs:
    version: OPENAPI_3_1
  paths-to-match: /api/v1/**
  packages-to-scan: io.github.yongyong14.parking_server
  override-with-generic-response: false

# Keep URL/query, rejected values and invocation arguments out of ordinary DEBUG diagnostics.
# Explicit overrides of these individual loggers and external proxy logs remain deployment concerns.
logging:
  level:
    org.springframework.security.web.FilterChainProxy: INFO
    org.springframework.web.servlet.DispatcherServlet: INFO
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: INFO
    org.springframework.web.method.support.InvocableHandlerMethod: INFO
    org.springframework.web.method.HandlerMethod: INFO
    # JDBC bind TRACE output would include nearby request coordinates.
    org.springframework.jdbc.core.StatementCreatorUtils: INFO
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO

# No access log by default. If enabled, %U is the path only; never add %q or %r.
server:
  tomcat:
    accesslog:
      enabled: false
      pattern: '%h %l %u %t "%m %U %H" %s %b'

app:
  kakao:
    local:
      rest-api-key: ${KAKAO_LOCAL_REST_API_KEY:}
  auth:
    issuer: ${JWT_ISSUER}
    secret-base64: ${JWT_SECRET_BASE64}
    access-ttl: ${JWT_ACCESS_TTL:30m}
    refresh-ttl: ${AUTH_REFRESH_TTL:30d}
  account:
    kakao-app-id: "${KAKAO_APP_ID:0}"
    kakao-admin-key: "${KAKAO_PRIMARY_ADMIN_KEY:}"
    terms-versions: "${AUTH_TERMS_VERSIONS:}"
    privacy-versions: "${AUTH_PRIVACY_VERSIONS:}"
    location-versions: "${AUTH_LOCATION_VERSIONS:}"
  security:
    swagger-public: false
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
