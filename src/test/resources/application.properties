# HTTP/context tests do not access a DB; PostgreSQL verification runs separately.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
# These HTTP tests have no EntityManagerFactory; postgresTest verifies real auditing.
app.jpa-auditing.enabled=false

app.auth.issuer=parking-test
app.auth.secret-base64=${random.value}${random.value}
app.auth.access-ttl=30m
app.auth.refresh-ttl=30d
app.security.swagger-public=true
