name: parking-prod

services:
  db:
    image: postgis/postgis:16-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks: [backend]
    logging: &logging
      driver: local
      options:
        max-size: 10m
        max-file: '3'

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: '5432'
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?required}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend]
    logging: *logging

networks:
  backend:
    internal: true
  frontend:

volumes:
  db_data:
  caddy_data:
  caddy_config:
